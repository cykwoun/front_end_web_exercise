
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Type Archive</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="archive">

    <header>
      <nav>
        <span>TYPEFACES</span>
        <span>ABOUT</span>
        <span>ARCHIVE</span>
      </nav>

      <div class="logo">type®</div>

      <div class="sub">
        <span>INDEPENDENT TYPE ARCHIVE</span>
        <span>2026 — VOL. 01</span>
      </div>
    </header>

    <section class="specimen" aria-label="Typeface specimen">
      <div id="sample">Ag</div>
    </section>

    <section class="controls">

      <div class="meta">
        <span>SELECT TYPEFACE / 05</span>
        <span id="counter">01 — 05</span>
      </div>

      <div id="choices" class="choices"></div>

      <div class="footer">
        <div>
          <h1 id="font-name">MONUMENT</h1>
          <p id="description">Heavy display / Condensed sans</p>
        </div>

        <button id="next">NEXT →</button>
      </div>

    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
